runtime: nodejs20
instance_class: F1
entrypoint: npm start

env_variables:
  NODE_ENV: "production"
  MONGO_URI: "__SET_IN_GCP_ENV__"
  JWT_SECRET: "__SET_IN_GCP_ENV__"
  ADMIN_USERNAME: "__SET_IN_GCP_ENV__"
  ADMIN_PASSWORD: "__SET_IN_GCP_ENV__"
  CORS_ORIGIN: "https://your-frontend-domain.vercel.app,https://your-admin-domain.vercel.app"

handlers:
  - url: /.*
    script: auto
    secure: always